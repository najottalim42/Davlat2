<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where in the world?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;800&display=swap" rel="stylesheet">

  <!-- CSS alohida papkada -->
  <link rel="stylesheet" href="./csss/main.css">

  <!-- Temani sahifa ochilishidan oldin qo'yish -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo">Where in the world?</a>

      <button id="themeBtn" class="theme-btn" type="button" aria-label="Toggle dark mode">
        <svg class="theme-btn__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span id="themeText">Dark Mode</span>
      </button>
    </div>
  </header>

  <main class="container main">
    <!-- BOSH SAHIFA -->
    <section id="homeView">
      <div class="controls">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="search" id="searchInput" placeholder="Search for a country..." autocomplete="off">
        </label>

        <div class="dropdown" id="dropdown">
          <button class="dropdown__btn" id="dropdownBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="dropdownLabel">Filter by Region</span>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <ul class="dropdown__menu" id="dropdownMenu" role="listbox">
            <li><button type="button" data-region="">All</button></li>
            <li><button type="button" data-region="Africa">Africa</button></li>
            <li><button type="button" data-region="Americas">America</button></li>
            <li><button type="button" data-region="Asia">Asia</button></li>
            <li><button type="button" data-region="Europe">Europe</button></li>
            <li><button type="button" data-region="Oceania">Oceania</button></li>
          </ul>
        </div>
      </div>

      <p id="status" class="status"></p>
      <div class="grid" id="grid"></div>
    </section>

    <!-- DAVLAT HAQIDA BATAFSIL -->
    <section id="detailView" class="detail" hidden></section>
  </main>

  <!-- JS alohida papkada, import ishlashi uchun type="module" -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
